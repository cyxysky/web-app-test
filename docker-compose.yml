services:
  webpilot-qa:
    build:
      context: .
      args:
        WEBPILOT_BASE_PATH: ${WEBPILOT_BASE_PATH:-}
        GLINER_MODEL: fastino/gliner2.5-multi-v1
        GLINER_CHINESE_NER_MODEL: uer/roberta-base-finetuned-cluener2020-chinese
        GLINER_PII_MODEL: LiquidAI/LFM2.5-Encoder-350M-PII-Detector
    image: webpilot-qa:latest
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HEADLESS_BROWSER: "true"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      APP_DATA_DIR: /app
      ARTIFACTS_DIR: /app/artifacts
      BROWSER_CHAT_PREVIEW_WS_PORT: "${BROWSER_CHAT_PREVIEW_WS_PORT:-18021}"
      WEBPILOT_DEFAULT_USER_ID: "${WEBPILOT_DEFAULT_USER_ID:-1}"
      WEBPILOT_REQUIRE_MOUNT_USER_ID: "${WEBPILOT_REQUIRE_MOUNT_USER_ID:-true}"
      AI_SENSITIVE_DATA_FILTER_ENABLED: "${AI_SENSITIVE_DATA_FILTER_ENABLED:-true}"
      AI_SENSITIVE_DATA_FILTER_FAILURE_MODE: "${AI_SENSITIVE_DATA_FILTER_FAILURE_MODE:-closed}"
      GLINER_RUNTIME_MODE: "local"
      GLINER_SERVICE_URL: "http://127.0.0.1:18001"
      GLINER_SERVICE_API_KEY: "${GLINER_SERVICE_API_KEY:-}"
    volumes:
      - ./.data:/app/.data
      - ./artifacts:/app/artifacts
    restart: unless-stopped
