services:
  webpilot-qa:
    build: .
    image: webpilot-qa:latest
    ports:
      - "3000:3000"
      - "${BROWSER_CHAT_PREVIEW_WS_PORT:-18021}:${BROWSER_CHAT_PREVIEW_WS_PORT:-18021}"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HEADLESS_BROWSER: "true"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      BROWSER_CHAT_PREVIEW_WS_PORT: "${BROWSER_CHAT_PREVIEW_WS_PORT:-18021}"
    volumes:
      - ./.data:/app/.data
      - ./artifacts:/app/artifacts
    restart: unless-stopped
