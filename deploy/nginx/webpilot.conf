# Put this map in nginx.conf's http {} block, not inside server {}.
map $http_upgrade $webpilot_connection_upgrade {
    default upgrade;
    ''      close;
}

# This Nginx must run inside Kubernetes (for example as an Nginx Pod),
# otherwise it cannot resolve the Kubernetes Service DNS name below.
upstream webpilot_upstream {
    server webpilot.default.svc.cluster.local:3000;
    keepalive 16;
}

server {
    listen 443 ssl;
    server_name 10.10.0.90;

    # Keep your existing ssl_certificate / ssl_certificate_key directives here.

    location = /webpilot {
        return 308 /webpilot/;
    }

    location ^~ /webpilot/ {
        # No trailing slash: preserves /webpilot/... for Next.js basePath.
        proxy_pass http://webpilot_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Required for both browser preview and realtime refresh WebSockets.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $webpilot_connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;

        proxy_connect_timeout 60s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        client_max_body_size 50m;
    }
}
